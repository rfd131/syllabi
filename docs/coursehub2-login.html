<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biocalculus CourseHub - Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: white;
            font-size: 2em;
            font-weight: bold;
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 1.8em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .note-box {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            color: #333;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .legacy-link {
            margin-top: 25px;
            font-size: 0.9em;
            color: #666;
        }
        a { color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">B</div>
        <h1>Biocalculus CourseHub</h1>
        <p class="subtitle">Math 140B / Math 141B &mdash; Fall 2026</p>

        <div class="note-box">
            Sign in with your Penn State Google account
            (<strong>xyz123@psu.edu</strong>) to access CourseHub.
        </div>

        <a class="btn" href="https://coursehub2-6413757358.us-east4.run.app/">Go to CourseHub</a>

        <p class="legacy-link">
            Looking for the Spring 2026 Course Hub?
            <a href="coursehub-login.html">Sign in here</a>.
        </p>
    </div>
</body>
</html>
